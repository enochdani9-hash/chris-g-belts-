<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRIS-G SWISS BELTS | Luxury Swiss Craftsmanship</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #070707;
            --surface: #111111;
            --surface-elevated: #1a1a1a;
            --glass: rgba(18, 18, 18, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.2);
            --primary: #ffffff;
            --muted: #8e8e93;
            --accent: #E53935;
            --whatsapp: #25D366;
            --gold: #D4AF37;
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Ambient luxury glow */
        .ambient-glow {
            position: fixed;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 400px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.09) 0%, rgba(229, 57, 53, 0.05) 45%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Navigation Header */
        header {
            position: sticky;
            top: 0;
            z-index: 90;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-name {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 1.8px;
            background: linear-gradient(135deg, #ffffff 40%, #a1a1a6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge-delivery {
            display: none;
            background: rgba(37, 211, 102, 0.1);
            border: 1px solid rgba(37, 211, 102, 0.25);
            color: var(--whatsapp);
            font-size: 0.7rem;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        @media(min-width: 480px) { .badge-delivery { display: inline-block; } }

        /* Cart Launcher Button */
        .cart-trigger {
            position: relative;
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .cart-trigger:hover { border-color: var(--border-hover); }
        .cart-count {
            background: var(--accent);
            color: white;
            font-size: 0.7rem;
            font-weight: 800;
            border-radius: 20px;
            padding: 2px 7px;
            min-width: 18px;
            text-align: center;
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 35px 20px 15px;
            position: relative;
            z-index: 1;
        }
        .hero h2 {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }
        .hero p {
            color: var(--muted);
            font-size: 0.88rem;
            max-width: 450px;
            margin: 0 auto;
        }

        /* Product Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
            gap: 16px;
            padding: 20px;
            max-width: 720px;
            margin: 0 auto 80px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: var(--border-hover);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .img-wrap {
            position: relative;
            width: 100%;
            height: 180px;
            background: #171717;
            overflow: hidden;
        }
        .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .card:hover .img-wrap img { transform: scale(1.05); }

        .discount-pill {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--accent);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 3px 6px;
            border-radius: 6px;
            z-index: 2;
        }

        .stock-pill {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #d1d1d6;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stock-pill span.dot {
            width: 6px;
            height: 6px;
            background: var(--whatsapp);
            border-radius: 50%;
        }

        .card-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .card-title {
            font-size: 0.86rem;
            font-weight: 600;
            color: #efefef;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .price-line {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 12px;
        }
        .price-now {
            font-size: 1.05rem;
            font-weight: 800;
            color: #fff;
        }
        .price-was {
            font-size: 0.75rem;
            color: var(--muted);
            text-decoration: line-through;
        }

        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 6px;
        }
        .btn-view {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: #ccc;
            padding: 9px 0;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn-view:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }

        .btn-add {
            background: #ffffff;
            border: none;
            color: #000;
            padding: 9px 0;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }
        .btn-add:hover { background: #e5e5e5; }

        /* Floating WhatsApp Quick-Chat */
        .wa-float {
            position: fixed;
            bottom: 24px;
            right: 20px;
            background: var(--whatsapp);
            color: #fff;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.35);
            z-index: 85;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .wa-float:hover { transform: scale(1.08); }
        .wa-float svg { width: 28px; height: 28px; fill: currentColor; }

        /* General Modal Backdrop */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            position: relative;
            animation: modalPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalPop {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .btn-close {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Product Preview Elements */
        .preview-img-box { width: 100%; height: 270px; background: #181818; }
        .preview-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .preview-content { padding: 22px; }
        .preview-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .preview-title { font-size: 1.25rem; font-weight: 700; }
        .preview-stock {
            color: var(--whatsapp);
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(37, 211, 102, 0.1);
            border: 1px solid rgba(37, 211, 102, 0.2);
            padding: 3px 8px;
            border-radius: 12px;
            margin-top: 4px;
        }
        .preview-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }

        /* Quantity Controller */
        .qty-picker {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .qty-picker label { font-size: 0.8rem; font-weight: 600; color: #888; text-transform: uppercase; }
        .qty-controls {
            display: inline-flex;
            align-items: center;
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .qty-btn {
            background: transparent;
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qty-btn:active { background: rgba(255,255,255,0.1); }
        .qty-num { width: 34px; text-align: center; font-weight: 700; font-size: 0.95rem; }

        /* Cart Drawer System */
        .cart-drawer-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 250;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
        }
        .cart-drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            max-width: 420px;
            background: #111111;
            border-left: 1px solid var(--border);
            z-index: 260;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .cart-drawer.open { transform: translateX(0); }

        .cart-top {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cart-top h3 { font-size: 1.1rem; font-weight: 800; letter-spacing: 0.5px; }

        .cart-items-scroll {
            flex-grow: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .cart-empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }
        .cart-empty-state svg { width: 44px; height: 44px; stroke: #444; margin-bottom: 12px; }

        .cart-item {
            display: flex;
            gap: 12px;
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            align-items: center;
        }
        .cart-item img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            background: #000;
        }
        .cart-item-details { flex-grow: 1; }
        .cart-item-name { font-size: 0.85rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .cart-item-price { font-size: 0.8rem; color: var(--gold); font-weight: 700; }
        
        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
        }
        .mini-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .cart-footer {
            border-top: 1px solid var(--border);
            padding: 18px 20px;
            background: #0e0e0e;
        }

        .subtotal-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .subtotal-row span { font-size: 0.9rem; color: var(--muted); }
        .subtotal-row strong { font-size: 1.25rem; font-weight: 800; color: #fff; }

        /* Checkout Inputs Inside Drawer */
        .checkout-fields {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .checkout-fields input {
            background: #181818;
            border: 1px solid var(--border);
            color: #fff;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        .checkout-fields input:focus { border-color: #ffffff; }

        .btn-checkout {
            background: var(--whatsapp);
            border: none;
            color: #fff;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.3);
            transition: opacity 0.2s;
        }
        .btn-checkout:hover { opacity: 0.95; }
        .btn-checkout:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>

    <header>

    <!-- Product Grid -->
    <main class="grid" id="beltContainer"></main>

    <a href="https://wa.me/233232669521?text=Hello%20Chris-G%20Swiss%20Belts,%20I'm%20inquiring%20about%20your%20belts%20in%20Accra."

    <!-- Product Preview Modal -->
    <div class="modal-overlay" id="previewModal">
        <div class="modal-box">
            <button class="btn-close" onclick="closePreview()">&times;</button>
            <div class="preview-img-box">
                <img id="previewImg" src="" alt="Belt preview">
            </div>
            <div class="preview-content">

                    <div>

                        <button class="qty-btn" onclick="adjustPreviewQty(1)">+</button>

                <button class="btn-checkout" onclick="addPreviewItemToCart()">Add To Cart</button>

    <!-- Cart Drawer & Pay-on-Delivery Checkout -->
    <div class="cart-drawer-overlay" id="cartOverlay" onclick="closeCart()"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-top">
            <h3>Your Selected Belts</h3>
            <button class="btn-close" style="position: static;" onclick="closeCart()">&times;</button>
        </div>

        <div class="cart-items-scroll" id="cartItemsContainer">
            <!-- Dynamic Cart Items Populate Here -->
        </div>

        <div class="cart-footer">
            <div class="subtotal-row">
                <span>Total (Pay on Delivery)</span>
                <strong id="cartSubtotal">GH₵0</strong>
            </div>

            <div class="checkout-fields">
                <input type="text" id="custName" placeholder="Full Name (e.g. Kwame Mensah)">

                <input type="text" id="custLocation" placeholder="Delivery Location in Accra (e.g. East Legon)">
            </div>

            <button class="btn-checkout" id="orderSubmitBtn" onclick="submitCartOrder()">
                Confirm Pay-on-Delivery Order
            </button>

    <script>
        const supabaseUrl = 'https://kadyjwbdrmnavjgwmrse.supabase.co';
        const supabaseKey = 'sb_publishable_6XKVRJnKzAa-DSpeuiqsHg_M8-OdEAT';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Store and Inventory
        let beltCatalog = [];
        let cart = [];
        let previewBelt = null;
        let previewQuantity = 1;

        const beltDescriptions = {
            "Chris-G Classic White": "Crafted from full-grain Swiss leather featuring an automatic brushed silver ratchet buckle. Tailored for wedding receptions, weekend luxury, and standout executive wear.",
            "Chris-G Smooth Brown": "Warm chestnut brown leather featuring a sleek scratch-resistant sliding track. Designed to comfortably pair with corporate tailored suits and smart-casual chinos.",
            "Chris-G Smooth Black": "The definitive boardroom classic. Pure obsidian black leather equipped with a micro-adjustable ratchet mechanism for zero-hole, pinpoint waist comfort.",
            "Chris-G Textured Brown": "Distinguished textured crocodile-grain finish with double-layer reinforced edge stitching. Engineered for durability, luxury presence, and daily resilience."
        };

        // Load Products from Supabase
        async function fetchBelts() {
            const { data, error } = await supabaseClient.from('belts').select('*');
            if (error) {
                console.error("Supabase Error:", error);
                return;
            }
            beltCatalog = data;
            renderBelts();
        }

        function renderBelts() {
            const container = document.getElementById('beltContainer');
            container.innerHTML = '';

            beltCatalog.forEach(belt => {
                const discount = Math.round(((belt.original_price - belt.sale_price) / belt.original_price) * 100);
                const discountBadge = discount > 0 ? `<div class="discount-pill">-${discount}%</div>` : '';
                const stockCount = belt.stock_count || 100;
                const img = belt.image_url || 'https://placehold.co/400x400/181818/888?text=Swiss+Belt';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    ${discountBadge}
                    <div class="img-wrap">
                        <img src="${img}" alt="${belt.name}">
                        <div class="stock-pill"><span class="dot"></span> ${stockCount} left</div>
                    </div>
                    <div class="card-info">
                        <div>
                            <div class="card-title">${belt.name}</div>
                            <div class="price-line">
                                <span class="price-now">GH₵${belt.sale_price}</span>
                                <span class="price-was">GH₵${belt.original_price}</span>
                            </div>
                        </div>
                        <div class="card-actions">
                            <button class="btn-view" onclick="openPreview('${belt.id}')">Details</button>
                            <button class="btn-add" onclick="quickAddToCart('${belt.id}')">+ Cart</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Product Preview Modal
        function openPreview(beltId) {
            previewBelt = beltCatalog.find(b => b.id === beltId);
            if (!previewBelt) return;

            previewQuantity = 1;
            document.getElementById('previewQtyNum').innerText = previewQuantity;
            document.getElementById('previewTitle').innerText = previewBelt.name;
            document.getElementById('previewPrice').innerText = `GH₵${previewBelt.sale_price}`;
            document.getElementById('previewOrigPrice').innerText = `GH₵${previewBelt.original_price}`;
            document.getElementById('previewStock').innerText = `In Stock: ${previewBelt.stock_count || 100}`;
            document.getElementById('previewImg').src = previewBelt.image_url;
            document.getElementById('previewDesc').innerText = beltDescriptions[previewBelt.name] || 
                "High-performance Swiss automatic belt crafted with genuine leather and micro-adjustable ratchet convenience.";

            document.getElementById('previewModal').style.display = 'flex';
        }

        function closePreview() {
            document.getElementById('previewModal').style.display = 'none';
        }

        function adjustPreviewQty(delta) {
            const maxStock = previewBelt ? (previewBelt.stock_count || 100) : 100;
            previewQuantity = Math.max(1, Math.min(maxStock, previewQuantity + delta));
            document.getElementById('previewQtyNum').innerText = previewQuantity;
        }

        function addPreviewItemToCart() {
            if (!previewBelt) return;
            addToCart(previewBelt.id, previewQuantity);
            closePreview();
            openCart();
        }

        function quickAddToCart(beltId) {
            addToCart(beltId, 1);
            openCart();
        }

        // Cart State & Calculations
        function addToCart(beltId, qty) {
            const belt = beltCatalog.find(b => b.id === beltId);
            if (!belt) return;

            const existingIndex = cart.findIndex(item => item.id === beltId);
            const stockLimit = belt.stock_count || 100;

            if (existingIndex > -1) {
                cart[existingIndex].quantity = Math.min(stockLimit, cart[existingIndex].quantity + qty);
            } else {
                cart.push({
                    id: belt.id,
                    name: belt.name,
                    sale_price: belt.sale_price,
                    image_url: belt.image_url,
                    stock_count: stockLimit,
                    quantity: Math.min(stockLimit, qty)
                });
            }
            updateCartDisplay();
        }

        function modifyCartQty(beltId, delta) {
            const item = cart.find(i => i.id === beltId);
            if (!item) return;

            item.quantity += delta;
            if (item.quantity <= 0) {
                cart = cart.filter(i => i.id !== beltId);
            } else if (item.quantity > item.stock_count) {
                item.quantity = item.stock_count;
            }
            updateCartDisplay();
        }

        function updateCartDisplay() {
            const countBadge = document.getElementById('cartCountBadge');
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            countBadge.innerText = totalCount;

            const container = document.getElementById('cartItemsContainer');
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="cart-empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                        <p>Your bag is empty.</p>
                        <span style="font-size:0.75rem; color:#666;">Choose a belt to begin.</span>
                    </div>
                `;
                document.getElementById('cartSubtotal').innerText = "GH₵0";
                return;
            }

            container.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                const itemTotal = item.sale_price * item.quantity;
                total += itemTotal;

                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <img src="${item.image_url}" alt="${item.name}">
                    <div class="cart-item-details">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-price">GH₵${item.sale_price} &times; ${item.quantity} = GH₵${itemTotal}</div>
                        <div class="cart-item-controls">
                            <button class="mini-btn" onclick="modifyCartQty('${item.id}', -1)">-</button>
                            <span style="font-size:0.8rem; font-weight:700; width:20px; text-align:center;">${item.quantity}</span>
                            <button class="mini-btn" onclick="modifyCartQty('${item.id}', 1)">+</button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });

            document.getElementById('cartSubtotal').innerText = `GH₵${total}`;
        }

        function openCart() {
            document.getElementById('cartDrawer').classList.add('open');
            document.getElementById('cartOverlay').style.display = 'block';
        }

        function closeCart() {
            document.getElementById('cartDrawer').classList.remove('open');
            document.getElementById('cartOverlay').style.display = 'none';
        }

        // Multi-Item Order Submission (Supabase + Make.com)
        async function submitCartOrder() {
            if (cart.length === 0) {
                alert("Your cart is empty. Please select at least one belt!");
                return;
            }

            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const location = document.getElementById('custLocation').value.trim();

            if (!name || !phone || !location) {
                alert("Please complete your name, phone number, and Accra delivery address.");
                return;
            }

            const btn = document.getElementById('orderSubmitBtn');
            btn.innerText = "Confirming Order...";
            btn.disabled = true;

            // 1. Build an order record for every unique item in cart for Supabase
            const orderRows = cart.map(item => ({
                belt_id: item.id,
                customer_name: cart.length > 1 ? `${name} (${item.quantity}x)` : name,
                phone_number: phone,
                delivery_location: location
            }));

            const { error } = await supabaseClient.from('orders').insert(orderRows);
            if (error) {
                console.error("Order error:", error);
                alert("Could not process order. Please check your network and try again.");
                btn.innerText = "Confirm Pay-on-Delivery Order";
                btn.disabled = false;
                return;
            }

            // 2. Format a detailed summary for Make.com & your email alerts
            const totalGhc = cart.reduce((sum, i) => sum + (i.sale_price * i.quantity), 0);
            const itemsSummary = cart.map(i => `${i.name} (Qty: ${i.quantity})`).join(', ');
            const formattedBeltPayload = `${itemsSummary} | Total: GH₵${totalGhc}`;

            try {
                await fetch('https://hook.eu1.make.com/uehjef8tcnwlvg3957zbe6yg4y7qk9gk', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customer_name: name,
                        phone_number: phone,
                        delivery_location: location,
                        belt_id: formattedBeltPayload
                    })
                });
            } catch (err) {
                console.log("Webhook alert sent with status:", err);
            }

            // Success feedback
            alert(`🎉 Order Confirmed!\n\nThank you, ${name}. We have received your order for:\n${itemsSummary}\n\nWe will call ${phone} shortly to coordinate your delivery in Accra!`);
            
            cart = [];
            updateCartDisplay();
            closeCart();
            document.getElementById('custName').value = '';
            document.getElementById('custPhone').value = '';
            document.getElementById('custLocation').value = '';
            btn.innerText = "Confirm Pay-on-Delivery Order";
            btn.disabled = false;
        }

        // Initialize Storefront
        fetchBelts();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRIS-G SWISS BELTS | Pay on Delivery</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #111111;
            --accent: #E53935; 
            --bg: #F8F9FA;
            --whatsapp: #25D366;
        }
        body {
            font-family: 'Poppins', sans-serif; margin: 0; padding: 0;
            background-color: var(--bg); color: var(--primary);
        }
        .header {
            background-color: #ffffff; text-align: center; padding: 20px 15px;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .header h2 { margin: 0; font-size: 1.5em; font-weight: 700; letter-spacing: 1px; }
        .header p { font-size: 0.85em; color: #666; margin: 5px 0 0 0; font-weight: 600; }
        .header span.highlight { color: var(--whatsapp); }
        
        .product-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            padding: 15px; max-width: 600px; margin: 0 auto;
        }
        .belt-card {
            background: #ffffff; border-radius: 12px; overflow: hidden; position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04); display: flex; flex-direction: column;
        }
        .discount-badge {
            position: absolute; top: 10px; left: 10px; background-color: var(--accent);
            color: white; font-size: 0.75em; font-weight: 700; padding: 4px 8px;
            border-radius: 4px; z-index: 2;
        }
        .belt-image { width: 100%; height: 160px; background-color: #eee; object-fit: cover; }
        .card-content { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .belt-title { font-size: 0.9em; font-weight: 600; margin: 0 0 8px 0; line-height: 1.2; color: #333; }
        .price-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .sale-price { font-weight: 700; color: var(--primary); font-size: 1.1em; }
        .original-price { text-decoration: line-through; color: #999; font-size: 0.8em; }
        .buy-btn {
            background-color: var(--primary); color: white; border: none; padding: 10px;
            width: 100%; border-radius: 8px; font-family: inherit; font-weight: 600;
            font-size: 0.9em; cursor: pointer; text-transform: uppercase;
        }

        /* The Checkout Modal */
        .modal {
            display: none; position: fixed; z-index: 200; left: 0; top: 0; 
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.6);
            align-items: center; justify-content: center;
        }
        .modal-content {
            background-color: #fff; padding: 25px; border-radius: 12px;
            width: 90%; max-width: 400px; position: relative; box-sizing: border-box;
        }
        .close-modal {
            position: absolute; top: 10px; right: 15px; font-size: 1.8em; 
            cursor: pointer; color: #333; line-height: 1;
        }
        .modal h3 { margin-top: 0; margin-bottom: 5px; }
        .selected-belt { color: var(--accent); font-weight: 600; font-size: 0.9em; margin-bottom: 20px; display: block; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85em; margin-bottom: 5px; font-weight: 600; }
        .form-group input { 
            width: 100%; padding: 12px; border: 1px solid #ddd; 
            border-radius: 6px; font-family: inherit; box-sizing: border-box; 
        }
        .submit-btn {
            background-color: var(--whatsapp); color: white; border: none; 
            padding: 12px; width: 100%; border-radius: 8px; font-family: inherit; 
            font-weight: 600; font-size: 1em; cursor: pointer; text-transform: uppercase;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>CHRIS-G SWISS BELTS</h2>
        <p>Order Now, <span class="highlight">Pay on Delivery</span> in Accra</p>
    </div>

    <div class="product-grid" id="belt-container">
        <!-- Belts will load here -->
    </div>

    <!-- The Checkout Form -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h3>Complete Your Order</h3>
            <span class="selected-belt" id="modalBeltName"></span>
            
            <input type="hidden" id="beltId">
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="customerName" placeholder="e.g. Kwame Mensah">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phoneNumber" placeholder="e.g. 054 123 4567">
            </div>
            <div class="form-group">
                <label>Delivery Location in Accra</label>
                <input type="text" id="deliveryLocation" placeholder="e.g. East Legon, near the mall">
            </div>
            <button class="submit-btn" onclick="submitOrder()">Confirm Order</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://kadyjwbdrmnavjgwmrse.supabase.co';
        const supabaseKey = 'sb_publishable_6XKVRJnKzAa-DSpeuiqsHg_M8-OdEAT';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let selectedBeltName = "";

        async function loadBelts() {
            const { data: belts, error } = await supabaseClient.from('belts').select('*');

            if (error) {
                console.error("Error loading belts:", error);
                return;
            }

            const container = document.getElementById('belt-container');
            container.innerHTML = ''; 
            
            belts.forEach(belt => {
                const discount = Math.round(((belt.original_price - belt.sale_price) / belt.original_price) * 100);
                const badgeHTML = discount > 0 ? `<div class="discount-badge">-${discount}%</div>` : '';
                const imageUrl = belt.image_url ? belt.image_url : 'https://placehold.co/400x400/eeeeee/999999?text=No+Image';

                const card = document.createElement('div');
                card.className = 'belt-card';
                card.innerHTML = `
                    ${badgeHTML}
                    <img src="${imageUrl}" class="belt-image" alt="${belt.name}">
                    <div class="card-content">
                        <div>
                            <h4 class="belt-title">${belt.name}</h4>
                            <div class="price-row">
                                <span class="sale-price">GH₵${belt.sale_price}</span>
                                <span class="original-price">GH₵${belt.original_price}</span>
                            </div>
                        </div>
                        <button class="buy-btn" onclick="openModal('${belt.id}', '${belt.name.replace(/'/g, "\\'")}')">Order Now</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Modal Functions
        function openModal(id, name) {
            document.getElementById('beltId').value = id;
            selectedBeltName = name;
            document.getElementById('modalBeltName').innerText = "Ordering: " + name;
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        // Submit Order to Database AND Make.com with name override
        async function submitOrder() {
            const beltId = document.getElementById('beltId').value;
            const name = document.getElementById('customerName').value;
            const phone = document.getElementById('phoneNumber').value;
            const location = document.getElementById('deliveryLocation').value;
            
            const modalText = document.getElementById('modalBeltName').innerText;
            const beltNameToSend = selectedBeltName || modalText.replace("Ordering: ", "") || "Swiss Belt";

            if (!name || !phone || !location) {
                alert("Please fill in all details so we can deliver your belt!");
                return;
            }

            const btn = document.querySelector('.submit-btn');
            btn.innerText = "Processing...";
            btn.disabled = true;

            // 1. Save to Supabase (Database still receives the real UUID belt_id correctly)
            const { error } = await supabaseClient
                .from('orders')
                .insert([{ 
                    belt_id: beltId, 
                    customer_name: name, 
                    phone_number: phone, 
                    delivery_location: location 
                }]);

            if (error) {
                alert("Something went wrong. Please try again.");
                btn.innerText = "Confirm Order";
                btn.disabled = false;
                return;
            } 
            
            // 2. Send instant alert to Make.com sending the name inside the belt_id slot
            try {
                await fetch('https://hook.eu1.make.com/uehjef8tcnwlvg3957zbe6yg4y7qk9gk', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customer_name: name,
                        phone_number: phone,
                        delivery_location: location,
                        belt_id: beltNameToSend // Forces the name into your existing Make.com tag!
                    })
                });
            } catch (err) {
                console.log("Webhook alert issue, but order saved:", err);
            }

            // 3. Success!
            alert("Order Received! We will call you shortly to arrange delivery.");
            closeModal();
            document.getElementById('customerName').value = '';
            document.getElementById('phoneNumber').value = '';
            document.getElementById('deliveryLocation').value = '';
            btn.innerText = "Confirm Order";
            btn.disabled = false;
        }

        loadBelts();
    </script>
</body>
</html>
